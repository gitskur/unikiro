<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coupa AI Facilitator</title>
<!-- marked.js: 마크다운 렌더링 -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #f0f0f0; display: flex; flex-direction: column; height: 100vh; }

/* ── 헤더 ── */
header {
  background: #e60012; color: #fff;
  padding: 14px 20px; display: flex; align-items: center; gap: 12px;
  flex-shrink: 0;
}
header h1 { font-size: 17px; font-weight: 700; }
header p  { font-size: 12px; opacity: .8; }

/* ── 채팅 영역 ── */
#chat {
  flex: 1; overflow-y: auto; padding: 20px;
  display: flex; flex-direction: column; gap: 14px;
}

.row { display: flex; }
.row.user { justify-content: flex-end; }
.row.ai   { justify-content: flex-start; }

.bubble {
  max-width: 72%; padding: 10px 14px; border-radius: 16px;
  font-size: 14px; line-height: 1.65; word-break: break-word;
}
.row.user .bubble {
  background: #e60012; color: #fff;
  border-bottom-right-radius: 4px;
}
.row.ai .bubble {
  background: #fff; color: #222;
  border-bottom-left-radius: 4px;
  box-shadow: 0 1px 4px rgba(0,0,0,.1);
}
/* 마크다운 스타일 */
.bubble h1,.bubble h2,.bubble h3 { margin: 8px 0 4px; font-size: 15px; }
.bubble ul,.bubble ol { padding-left: 18px; margin: 4px 0; }
.bubble li { margin: 2px 0; }
.bubble code { background: #f4f4f4; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
.bubble pre  { background: #f4f4f4; padding: 8px; border-radius: 6px; overflow-x: auto; margin: 6px 0; }
.bubble strong { font-weight: 600; }
.bubble table { border-collapse: collapse; width: 100%; margin: 6px 0; font-size: 13px; }
.bubble th,.bubble td { border: 1px solid #ddd; padding: 5px 8px; }
.bubble th { background: #f9f9f9; }

.typing { color: #999; font-style: italic; font-size: 13px; }

/* ── 빠른 질문 ── */
#quick { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 10px; }
.qbtn {
  background: #fff; border: 1px solid #e60012; color: #e60012;
  border-radius: 20px; padding: 5px 13px; font-size: 12px; cursor: pointer;
  transition: background .15s, color .15s;
}
.qbtn:hover { background: #e60012; color: #fff; }

/* ── 입력 영역 ── */
#input-area {
  background: #fff; border-top: 1px solid #ddd;
  padding: 10px 14px; display: flex; gap: 8px; align-items: flex-end;
  flex-shrink: 0;
}
#msg {
  flex: 1; border: 1px solid #ddd; border-radius: 20px;
  padding: 9px 14px; font-size: 14px; resize: none; outline: none;
  max-height: 120px; overflow-y: auto;
}
#msg:focus { border-color: #e60012; }
#send {
  background: #e60012; color: #fff; border: none;
  border-radius: 20px; padding: 9px 18px; font-size: 14px;
  cursor: pointer; white-space: nowrap; height: 38px;
}
#send:disabled { background: #ccc; cursor: not-allowed; }

/* ── 파일 업로드 미리보기 ── */
#file-label {
  cursor: pointer; color: #888; font-size: 20px; line-height: 1;
  padding: 4px; user-select: none;
}
#file-label:hover { color: #e60012; }
#file-input { display: none; }
#file-preview {
  display: flex; flex-wrap: wrap; gap: 6px;
  padding: 0 14px 8px; min-height: 0;
}
.file-chip {
  background: #fff3f3; border: 1px solid #e60012; color: #e60012;
  border-radius: 12px; padding: 3px 10px; font-size: 12px;
  display: flex; align-items: center; gap: 6px;
}
.file-chip button {
  background: none; border: none; color: #e60012;
  cursor: pointer; font-size: 14px; line-height: 1; padding: 0;
}
</style>
</head>
<body>

<header>
  <div>
    <h1>🛒 Coupa AI Facilitator</h1>
    <p>구매 · 계약 프로세스 안내 챗봇</p>
  </div>
</header>

<div id="chat">
  <div class="row ai">
    <div class="bubble">
      안녕하세요! 유니클로 구매/계약 프로세스 안내 챗봇입니다. 😊<br>
      궁금한 사항을 입력하거나 아래 빠른 질문을 눌러보세요.
    </div>
  </div>
</div>

<div id="quick">
  <button class="qbtn" onclick="quick('구매 요청 절차 알려줘')">📋 구매 요청 절차</button>
  <button class="qbtn" onclick="quick('금액별 결재 기준이 뭐야?')">💰 금액별 결재 기준</button>
  <button class="qbtn" onclick="quick('계약 연장하려면 뭐가 필요해?')">📄 계약 연장</button>
  <button class="qbtn" onclick="quick('긴급 구매는 어떻게 해?')">⚡ 긴급 구매</button>
  <button class="qbtn" onclick="quick('필요한 양식 목록 알려줘')">📎 양식 목록</button>
</div>

<div id="file-preview"></div>

<div id="input-area">
  <label id="file-label" title="파일 첨부">📎</label>
  <input id="file-input" type="file" accept=".pdf,.pptx,.ppt" multiple>
  <textarea id="msg" rows="1" placeholder="질문을 입력하세요..."></textarea>
  <button id="send" onclick="send()">전송</button>
</div>

<script>
// ── 설정 ──────────────────────────────────────────────────────────────────
const API = 'https://YOUR_API_URL/chat';   // ← B의 API Gateway URL로 교체

// ── 상태 ──────────────────────────────────────────────────────────────────
const messages = [];          // 대화 히스토리 (서버 전달용)
const attachedFiles = [];     // 첨부 파일 목록

// ── 빠른 질문 ─────────────────────────────────────────────────────────────
function quick(text) {
  document.getElementById('msg').value = text;
  send();
}

// ── 파일 첨부 미리보기 ────────────────────────────────────────────────────
document.getElementById('file-input').addEventListener('change', e => {
  [...e.target.files].forEach(f => {
    if (attachedFiles.find(x => x.name === f.name)) return;
    attachedFiles.push(f);
    renderFileChip(f);
  });
  e.target.value = '';
});

function renderFileChip(file) {
  const preview = document.getElementById('file-preview');
  const chip = document.createElement('div');
  chip.className = 'file-chip';
  chip.dataset.name = file.name;
  chip.innerHTML = `📄 ${file.name} <button onclick="removeFile('${file.name}')">×</button>`;
  preview.appendChild(chip);
}

function removeFile(name) {
  const idx = attachedFiles.findIndex(f => f.name === name);
  if (idx !== -1) attachedFiles.splice(idx, 1);
  document.querySelector(`.file-chip[data-name="${name}"]`)?.remove();
}

// ── 메시지 전송 ───────────────────────────────────────────────────────────
async function send() {
  const input = document.getElementById('msg');
  const text  = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';

  // 첨부 파일명을 메시지에 포함
  const fileNote = attachedFiles.length
    ? `\n\n[첨부 파일: ${attachedFiles.map(f => f.name).join(', ')}]`
    : '';
  const userText = text + fileNote;

  addBubble('user', userText);
  messages.push({ role: 'user', content: userText });

  // 첨부 파일 초기화
  attachedFiles.length = 0;
  document.getElementById('file-preview').innerHTML = '';

  const sendBtn = document.getElementById('send');
  sendBtn.disabled = true;
  const typingEl = addBubble('ai', '답변 생성 중...', true);

  try {
    const res  = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages }),
    });
    const data  = await res.json();
    const reply = data.reply || data.error || '오류가 발생했습니다.';

    typingEl.remove();
    addBubble('ai', reply);
    messages.push({ role: 'assistant', content: reply });
  } catch {
    typingEl.remove();
    addBubble('ai', '⚠️ API 연결 오류입니다. `index.html`의 API URL을 확인해 주세요.');
  }

  sendBtn.disabled = false;
  input.focus();
}

// ── 말풍선 추가 ───────────────────────────────────────────────────────────
function addBubble(role, text, isTyping = false) {
  const chat = document.getElementById('chat');
  const row  = document.createElement('div');
  row.className = `row ${role}`;

  const bubble = document.createElement('div');
  bubble.className = 'bubble' + (isTyping ? ' typing' : '');

  if (isTyping || role === 'user') {
    bubble.textContent = text;
  } else {
    // AI 응답: 마크다운 렌더링
    bubble.innerHTML = marked.parse(text);
  }

  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return row;
}

// ── 입력창 자동 높이 ──────────────────────────────────────────────────────
const msgEl = document.getElementById('msg');
msgEl.addEventListener('input', () => {
  msgEl.style.height = 'auto';
  msgEl.style.height = Math.min(msgEl.scrollHeight, 120) + 'px';
});
msgEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
</script>
</body>
</html>
