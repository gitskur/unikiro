<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coupa AI Chatbot</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f8f9fa}

/* ── 위젯 모드 (기본) ── */
#cb-float{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;align-items:center;gap:10px;cursor:grab;user-select:none;transition:opacity .3s}
#cb-float.dragging{cursor:grabbing}
#cb-float.hidden{opacity:0;pointer-events:none}
#cb-restore{position:fixed;bottom:24px;right:24px;z-index:9998;background:#4f46e5;color:#fff;border:none;padding:8px 16px;border-radius:20px;font-size:13px;cursor:pointer;box-shadow:0 2px 12px rgba(79,70,229,.3);display:none}
#cb-restore:hover{background:#4338ca}
#cb-bubble{background:#fff;padding:10px 16px;border-radius:20px;box-shadow:0 2px 12px rgba(0,0,0,.12);font-size:14px;animation:fadeUp .5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
#cb-toggle{width:56px;height:56px;border-radius:50%;background:#4f46e5;color:#fff;border:none;font-size:28px;cursor:pointer;box-shadow:0 4px 16px rgba(79,70,229,.4);transition:transform .2s}
#cb-toggle:hover{transform:scale(1.1)}

/* ── 채팅 패널 ── */
#cb-panel{position:fixed;z-index:9999;display:none;flex-direction:column;overflow:hidden;background:#fff;transition:all .3s ease}
#cb-panel.open{display:flex}
/* 위젯 크기 */
#cb-panel.widget{bottom:92px;right:24px;width:380px;height:520px;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.15)}
/* 전체화면 */
#cb-panel.full{top:0;left:0;right:0;bottom:0;width:100%;height:100%;border-radius:0}

#cb-header{padding:14px 18px;background:#4f46e5;color:#fff;font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
#cb-header button{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;padding:0 4px}

#cb-messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}

.msg{max-width:80%;padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.6;word-break:break-word}
.msg.user{align-self:flex-end;background:#4f46e5;color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:#f0f0f0;color:#333;border-bottom-left-radius:4px}
/* 마크다운 스타일 */
.msg.bot h1,.msg.bot h2,.msg.bot h3{margin:6px 0 3px;font-size:14px}
.msg.bot ul,.msg.bot ol{padding-left:18px;margin:4px 0}
.msg.bot code{background:#e8e8e8;padding:1px 4px;border-radius:3px;font-size:12px}
.msg.bot pre{background:#e8e8e8;padding:8px;border-radius:6px;overflow-x:auto;margin:4px 0}
.msg.bot table{border-collapse:collapse;width:100%;margin:4px 0;font-size:12px}
.msg.bot th,.msg.bot td{border:1px solid #ddd;padding:4px 6px}
.msg.bot strong{font-weight:600}
.typing{color:#999;font-style:italic}

/* ── 빠른 질문 ── */
#cb-quick{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px;border-top:1px solid #eee}
.qbtn{background:#fff;border:1px solid #4f46e5;color:#4f46e5;border-radius:16px;padding:4px 12px;font-size:11px;cursor:pointer;transition:.15s}
.qbtn:hover{background:#4f46e5;color:#fff}

/* ── 입력 ── */
#cb-input-area{display:flex;padding:10px;border-top:1px solid #e5e7eb;gap:6px;flex-shrink:0}
#cb-input{flex:1;padding:9px 12px;border:1px solid #d1d5db;border-radius:20px;outline:none;font-size:13px}
#cb-input:focus{border-color:#4f46e5}
#cb-send{width:36px;height:36px;border:none;background:#4f46e5;color:#fff;border-radius:50%;cursor:pointer;font-size:16px}
#cb-send:disabled{background:#ccc}
</style>
</head>
<body>

<!-- 기존 사이트 콘텐츠 예시 -->
<div style="max-width:800px;margin:60px auto;padding:20px">
  <h1 style="color:#333">회사 홈페이지</h1>
  <p style="color:#666;line-height:1.8;margin-top:12px">오른쪽 하단의 💬 버튼을 클릭하면 챗봇이 열립니다.</p>
</div>

<!-- 챗봇 위젯 -->
<button id="cb-restore">💬 챗봇 다시 열기</button>

<div id="cb-float">
  <div id="cb-bubble">도움이 필요하신가요? 💡</div>
  <button id="cb-toggle" aria-label="챗봇 열기">💬</button>
</div>

<div id="cb-panel" class="widget">
  <div id="cb-header">
    <span>🛒 Coupa AI 챗봇</span>
    <div>
      <button id="cb-hide" title="숨기기">🙈</button>
      <button id="cb-expand" title="전체화면">⛶</button>
      <button id="cb-close" title="닫기">✕</button>
    </div>
  </div>
  <div id="cb-messages">
    <div class="msg bot">안녕하세요! Coupa 구매/계약 관련 질문에 답변해드립니다. 😊</div>
  </div>
  <div id="cb-quick">
    <button class="qbtn" onclick="quick('CSP 로그인 방법 알려줘')">🔑 CSP 로그인</button>
    <button class="qbtn" onclick="quick('PO 확인하는 방법은?')">📋 PO 확인</button>
    <button class="qbtn" onclick="quick('인보이스 생성 방법')">💰 인보이스</button>
    <button class="qbtn" onclick="quick('계약 연장 절차')">📄 계약 연장</button>
  </div>
  <div id="cb-input-area">
    <input type="text" id="cb-input" placeholder="질문을 입력하세요..." autocomplete="off">
    <button id="cb-send" aria-label="전송">➤</button>
  </div>
</div>

<script>
const API_URL = 'https://bfmyt5l44m.execute-api.us-east-1.amazonaws.com/Prod';
const USER_ID = localStorage.getItem('cb_uid') || (() => { const id = 'user-' + Math.random().toString(36).slice(2,10); localStorage.setItem('cb_uid', id); return id; })();

const panel = document.getElementById('cb-panel');
const msgs = document.getElementById('cb-messages');
const input = document.getElementById('cb-input');
const sendBtn = document.getElementById('cb-send');
const bubble = document.getElementById('cb-bubble');
const float_ = document.getElementById('cb-float');
const restoreBtn = document.getElementById('cb-restore');

// 드래그 이동
let isDragging = false, dragMoved = false, startX, startY, origX, origY;
float_.addEventListener('mousedown', e => {
  isDragging = true; dragMoved = false;
  startX = e.clientX; startY = e.clientY;
  const r = float_.getBoundingClientRect();
  origX = r.left; origY = r.top;
  float_.classList.add('dragging');
});
document.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - startX, dy = e.clientY - startY;
  if (Math.abs(dx) > 4 || Math.abs(dy) > 4) dragMoved = true;
  float_.style.left = origX + dx + 'px'; float_.style.top = origY + dy + 'px';
  float_.style.right = 'auto'; float_.style.bottom = 'auto';
  if (panel.classList.contains('widget')) {
    panel.style.left = origX + dx + 'px'; panel.style.top = (origY + dy - 530) + 'px';
    panel.style.right = 'auto'; panel.style.bottom = 'auto';
  }
});
document.addEventListener('mouseup', () => { isDragging = false; float_.classList.remove('dragging'); });

// 토글 (드래그가 아닌 클릭만)
float_.addEventListener('click', e => {
  if (dragMoved) return;
  const open = panel.classList.toggle('open');
  bubble.style.display = open ? 'none' : '';
  if (open) input.focus();
});
document.getElementById('cb-close').onclick = e => {
  e.stopPropagation();
  panel.classList.remove('open'); bubble.style.display = '';
};

// 숨기기 / 복원
document.getElementById('cb-hide').onclick = e => {
  e.stopPropagation();
  panel.classList.remove('open');
  float_.classList.add('hidden');
  restoreBtn.style.display = 'block';
};
restoreBtn.onclick = () => {
  float_.classList.remove('hidden');
  restoreBtn.style.display = 'none';
};

// 전체화면 토글
document.getElementById('cb-expand').onclick = () => {
  panel.classList.toggle('widget');
  panel.classList.toggle('full');
  document.getElementById('cb-expand').textContent = panel.classList.contains('full') ? '⊡' : '⛶';
};

// 빠른 질문
function quick(text) { input.value = text; handleSend(); }

// 메시지 추가
function addMsg(text, type, isMarkdown = false) {
  const d = document.createElement('div');
  d.className = `msg ${type}`;
  if (isMarkdown && typeof marked !== 'undefined') {
    d.innerHTML = marked.parse(text);
  } else {
    d.textContent = text;
  }
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
  return d;
}

// 전송
async function handleSend() {
  const text = input.value.trim();
  if (!text) return;
  addMsg(text, 'user');
  input.value = '';
  sendBtn.disabled = true;

  const typing = document.createElement('div');
  typing.className = 'msg bot typing';
  typing.textContent = '답변 생성 중...';
  msgs.appendChild(typing);
  msgs.scrollTop = msgs.scrollHeight;

  try {
    const res = await fetch(API_URL + '/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text, user_id: USER_ID})
    });
    const data = await res.json();
    typing.remove();
    addMsg(data.answer || '답변을 가져올 수 없습니다.', 'bot', true);
  } catch(e) {
    typing.remove();
    addMsg('⚠️ 오류: ' + e.message, 'bot');
  }
  sendBtn.disabled = false;
  input.focus();
}

sendBtn.onclick = handleSend;
input.onkeydown = e => { if (e.key === 'Enter') handleSend(); };
</script>
</body>
</html>
