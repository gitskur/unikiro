AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Coupa AI Chatbot v3 - FAISS RAG + Coupa API + Teams + Scheduler

Parameters:
  CoupaBaseUrl:
    Type: String
    Default: ""
    Description: Coupa API base URL (optional, for live contract queries)
  CoupaApiKey:
    Type: String
    Default: ""
    NoEcho: true
  TeamsDefaultWebhookUrl:
    Type: String
    Default: ""
    Description: Teams Incoming Webhook fallback URL

Globals:
  Function:
    Timeout: 60
    Runtime: python3.9
    MemorySize: 512
    Environment:
      Variables:
        DOCS_BUCKET: !Ref DocsBucket
        CHAT_TABLE: !Ref ChatTable
        BEDROCK_MODEL_ID: amazon.nova-lite-v1:0
        EMBED_MODEL_ID: amazon.titan-embed-text-v2:0
        COUPA_BASE_URL: !Ref CoupaBaseUrl
        COUPA_API_KEY: !Ref CoupaApiKey
        TEAMS_DEFAULT_WEBHOOK_URL: !Ref TeamsDefaultWebhookUrl
  Api:
    Cors:
      AllowMethods: "'POST,GET,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowOrigin: "'*'"

Resources:
  DocsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub coupa-chatbot-docs-${AWS::AccountId}

  ChatTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: coupa-chatbot-logs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ChannelMappingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ChannelMapping
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  # Lambda 1: 챗봇 (RAG + Coupa + Teams)
  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: coupa-chatbot-rag
      CodeUri: lambda/
      Handler: handler.lambda_handler
      Layers:
        - !Ref DepsLayer
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DocsBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref ChatTable
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: "*"
      Events:
        Chat:
          Type: Api
          Properties:
            Path: /chat
            Method: post
        Teams:
          Type: Api
          Properties:
            Path: /teams
            Method: post
        Health:
          Type: Api
          Properties:
            Path: /health
            Method: get

  # Lambda 2: 임베딩
  EmbedFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: coupa-chatbot-embed
      CodeUri: lambda/
      Handler: embed.lambda_handler
      Timeout: 300
      MemorySize: 1024
      Layers:
        - !Ref DepsLayer
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DocsBucket
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: "*"

  # Lambda 3: 계약 만료 스케줄러 (매일 오전 9시 KST)
  SchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: coupa-chatbot-scheduler
      CodeUri: lambda_scheduler/
      Handler: handler.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ChannelMappingTable
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 0 * * ? *)
            Enabled: false

  # Lambda 4: Coupa Webhook 수신
  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: coupa-chatbot-webhook
      CodeUri: lambda_webhook/
      Handler: handler.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ChannelMappingTable
      Events:
        ContractWebhook:
          Type: Api
          Properties:
            Path: /coupa/webhook
            Method: post
        ApprovalWebhook:
          Type: Api
          Properties:
            Path: /coupa/approval-webhook
            Method: post

  DepsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: chatbot-deps
      ContentUri: lambda/deps/
      CompatibleRuntimes:
        - python3.9
    Metadata:
      BuildMethod: python3.9

Outputs:
  ApiUrl:
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod
  TeamsWebhookUrl:
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/teams
  CoupaWebhookUrl:
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/coupa/webhook
  ApprovalWebhookUrl:
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/coupa/approval-webhook
  DocsBucket:
    Value: !Ref DocsBucket
