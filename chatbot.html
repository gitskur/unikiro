<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회사 사이트</title>
<style>
/* 기존 사이트 예시 스타일 */
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #f8f9fa; }
.site-content { max-width: 800px; margin: 60px auto; padding: 20px; }
.site-content h1 { color: #333; }
.site-content p { color: #666; line-height: 1.8; margin-top: 12px; }
</style>
</head>
<body>

<!-- 기존 사이트 콘텐츠 예시 -->
<div class="site-content">
  <h1>회사 홈페이지</h1>
  <p>여기에 기존 사이트 콘텐츠가 들어갑니다. 오른쪽 하단의 말풍선 버튼을 클릭하면 챗봇이 열립니다.</p>
</div>

<!-- ✅ 여기부터 챗봇 위젯 — 기존 사이트에 이 부분만 복사하면 됩니다 -->
<style>
#chatbot-float { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; align-items: center; gap: 10px; cursor: grab; user-select: none; transition: opacity 0.3s; }
#chatbot-float.dragging { cursor: grabbing; }
#chatbot-float.hidden { opacity: 0; pointer-events: none; }
#chatbot-restore { position: fixed; bottom: 24px; right: 24px; z-index: 9998; background: #4f46e5; color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; box-shadow: 0 2px 12px rgba(79,70,229,0.3); display: none; }
#chatbot-restore:hover { background: #4338ca; }
#cw-hide { background: none; border: none; color: #fff; font-size: 16px; cursor: pointer; margin-right: 4px; }
#chatbot-bubble { background: #fff; color: #333; padding: 10px 16px; border-radius: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.12); font-size: 14px; white-space: nowrap; animation: cwFadeIn 0.5s ease; }
#chatbot-bubble::after { content: ''; position: absolute; right: 68px; bottom: 14px; border: 6px solid transparent; border-top-color: #fff; border-bottom: 0; }
@keyframes cwFadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
#chatbot-toggle { width: 56px; height: 56px; border-radius: 50%; background: #4f46e5; color: #fff; border: none; font-size: 28px; cursor: pointer; box-shadow: 0 4px 16px rgba(79,70,229,0.4); display: flex; align-items: center; justify-content: center; transition: transform 0.2s; flex-shrink: 0; }
#chatbot-toggle:hover { transform: scale(1.1); }
#chatbot-widget { position: fixed; bottom: 92px; right: 24px; width: 360px; height: 480px; background: #fff; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); z-index: 9999; display: none; flex-direction: column; overflow: hidden; }
#chatbot-widget.open { display: flex; }
#cw-header { padding: 14px 18px; background: #4f46e5; color: #fff; font-weight: 600; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
#cw-header button { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
#cw-messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.cw-msg { max-width: 78%; padding: 9px 13px; border-radius: 14px; font-size: 13px; line-height: 1.5; word-break: break-word; }
.cw-msg.user { align-self: flex-end; background: #4f46e5; color: #fff; border-bottom-right-radius: 4px; }
.cw-msg.bot { align-self: flex-start; background: #f0f0f0; color: #333; border-bottom-left-radius: 4px; }
.cw-typing { display: inline-flex; gap: 4px; }
.cw-typing span { width: 5px; height: 5px; background: #999; border-radius: 50%; animation: cwb 1.4s infinite; }
.cw-typing span:nth-child(2) { animation-delay: 0.2s; }
.cw-typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes cwb { 0%,80%,100%{opacity:.3} 40%{opacity:1} }
#cw-input-area { display: flex; padding: 10px; border-top: 1px solid #e5e7eb; gap: 6px; }
#cw-input-area input { flex: 1; padding: 9px 12px; border: 1px solid #d1d5db; border-radius: 20px; outline: none; font-size: 13px; }
#cw-input-area input:focus { border-color: #4f46e5; }
#cw-input-area button { width: 36px; height: 36px; border: none; background: #4f46e5; color: #fff; border-radius: 50%; cursor: pointer; font-size: 16px; }
</style>

<button id="chatbot-restore">💬 챗봇 다시 열기</button>

<div id="chatbot-float">
  <div id="chatbot-bubble">도움이 필요하신가요? 💡</div>
  <button id="chatbot-toggle" aria-label="챗봇 열기">💬</button>
</div>

<div id="chatbot-widget">
  <div id="cw-header">
    <span>💬 챗봇</span>
    <div>
      <button id="cw-hide" aria-label="숨기기" title="챗봇 숨기기">🙈</button>
      <button id="cw-close" aria-label="닫기">✕</button>
    </div>
  </div>
  <div id="cw-messages">
    <div class="cw-msg bot">안녕하세요! 무엇을 도와드릴까요?</div>
  </div>
  <div id="cw-input-area">
    <input type="text" id="cw-input" placeholder="메시지를 입력하세요..." autocomplete="off">
    <button id="cw-send" aria-label="전송">➤</button>
  </div>
</div>

<script>
const float = document.getElementById('chatbot-float');
const toggleBtn = document.getElementById('chatbot-toggle');
const bubble = document.getElementById('chatbot-bubble');
const widget = document.getElementById('chatbot-widget');
const closeBtn = document.getElementById('cw-close');
const hideBtn = document.getElementById('cw-hide');
const restoreBtn = document.getElementById('chatbot-restore');
const msgs = document.getElementById('cw-messages');
const input = document.getElementById('cw-input');
const sendBtn = document.getElementById('cw-send');

// 드래그 이동
let isDragging = false, dragMoved = false, startX, startY, origX, origY;

float.addEventListener('mousedown', e => {
  isDragging = true; dragMoved = false;
  startX = e.clientX; startY = e.clientY;
  const rect = float.getBoundingClientRect();
  origX = rect.left; origY = rect.top;
  float.classList.add('dragging');
});

document.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - startX, dy = e.clientY - startY;
  if (Math.abs(dx) > 4 || Math.abs(dy) > 4) dragMoved = true;
  float.style.left = origX + dx + 'px';
  float.style.top = origY + dy + 'px';
  float.style.right = 'auto'; float.style.bottom = 'auto';
  widget.style.left = origX + dx + 'px';
  widget.style.top = (origY + dy - 488) + 'px';
  widget.style.right = 'auto'; widget.style.bottom = 'auto';
});

document.addEventListener('mouseup', () => {
  if (isDragging) { isDragging = false; float.classList.remove('dragging'); }
});

// 클릭 (드래그가 아닌 경우만)
float.addEventListener('click', e => {
  if (dragMoved) return;
  const isOpen = widget.classList.toggle('open');
  if (isOpen) { bubble.style.display = 'none'; input.focus(); }
  else { bubble.style.display = ''; }
});

closeBtn.addEventListener('click', e => {
  e.stopPropagation();
  widget.classList.remove('open'); bubble.style.display = '';
});

// 숨기기 / 복원
hideBtn.addEventListener('click', e => {
  e.stopPropagation();
  widget.classList.remove('open');
  float.classList.add('hidden');
  restoreBtn.style.display = 'block';
});

restoreBtn.addEventListener('click', () => {
  float.classList.remove('hidden');
  restoreBtn.style.display = 'none';
});

function addMsg(text, type) {
  const d = document.createElement('div');
  d.className = `cw-msg ${type}`;
  d.textContent = text;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
  return d;
}

const API_URL = 'https://bfmyt5l44m.execute-api.us-east-1.amazonaws.com/Prod';
const USER_ID = localStorage.getItem('chatbot_uid') || (() => { const id = 'user-' + Math.random().toString(36).slice(2, 10); localStorage.setItem('chatbot_uid', id); return id; })();

async function handleSend() {
  const text = input.value.trim();
  if (!text) return;
  addMsg(text, 'user');
  input.value = '';
  const t = document.createElement('div');
  t.className = 'cw-msg bot';
  t.innerHTML = '<div class="cw-typing"><span></span><span></span><span></span></div>';
  msgs.appendChild(t);
  msgs.scrollTop = msgs.scrollHeight;
  try {
    const res = await fetch(API_URL + '/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text, user_id: USER_ID})
    });
    const data = await res.json();
    t.remove();
    addMsg(data.answer || '답변을 가져올 수 없습니다.', 'bot');
  } catch(e) {
    t.remove();
    addMsg('⚠️ 오류가 발생했습니다: ' + e.message, 'bot');
  }
}

sendBtn.addEventListener('click', handleSend);
input.addEventListener('keydown', e => { if (e.key === 'Enter') handleSend(); });
</script>
<!-- ✅ 챗봇 위젯 끝 -->

</body>
</html>
