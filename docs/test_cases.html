<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>테스트 케이스 정의서 — Coupa × Teams 챗봇</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --pass: #3fb950; --fail: #f85149; --partial: #d29922; --pending: #484f58;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, 'Segoe UI', sans-serif; font-size: 14px; }
  header { padding: 24px 32px 16px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 20px; font-weight: 600; }
  header p { color: var(--muted); margin-top: 4px; font-size: 13px; }

  /* Stats bar */
  .stats { display: flex; gap: 16px; padding: 12px 32px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .stat { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .badge { padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .badge.pass { background: #1a3a1f; color: var(--pass); }
  .badge.partial { background: #3a2e0a; color: var(--partial); }
  .badge.pending { background: #1c2128; color: var(--muted); }

  /* Tabs */
  .tabs { display: flex; gap: 0; padding: 0 32px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .tab { padding: 12px 20px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; font-size: 13px; font-weight: 500; transition: color .15s; white-space: nowrap; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* Content */
  .content { padding: 24px 32px; max-width: 1100px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* Section label */
  .section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 12px; }

  /* TC Card */
  .tc-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
  .tc-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; user-select: none; transition: background .1s; }
  .tc-header:hover { background: #1c2128; }
  .tc-id { font-size: 12px; font-weight: 700; color: var(--accent); min-width: 48px; }
  .tc-title { flex: 1; font-size: 13px; }
  .tc-input { color: var(--muted); font-size: 12px; flex: 2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .uat-badge { padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .uat-pass { background: #1a3a1f; color: var(--pass); }
  .uat-partial { background: #3a2e0a; color: var(--partial); }
  .uat-pending { background: #1c2128; color: var(--muted); }
  .chevron { color: var(--muted); font-size: 10px; transition: transform .2s; }
  .tc-card.open .chevron { transform: rotate(90deg); }

  /* TC Detail */
  .tc-detail { display: none; padding: 0 16px 16px; border-top: 1px solid var(--border); }
  .tc-card.open .tc-detail { display: block; }
  .detail-grid { display: grid; grid-template-columns: 120px 1fr; gap: 8px 16px; margin-top: 12px; }
  .detail-label { color: var(--muted); font-size: 12px; padding-top: 2px; }
  .detail-value { font-size: 13px; }
  .detail-value.expected { color: #79c0ff; }
  .detail-value.uat-result { font-weight: 600; }
  .detail-value.uat-result.pass { color: var(--pass); }
  .detail-value.uat-result.partial { color: var(--partial); }
  .priority-tag { display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .p-critical { background: #3d1a1a; color: #f85149; }
  .p-important { background: #3a2e0a; color: var(--partial); }
  .p-optional { background: #1a3a1f; color: var(--pass); }

  /* UAT edit */
  .uat-edit { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  .uat-edit label { color: var(--muted); font-size: 12px; }
  .uat-edit select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; font-size: 12px; cursor: pointer; }
  .uat-edit input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; font-size: 12px; flex: 1; }
  .uat-edit button { background: var(--accent); color: #0d1117; border: none; border-radius: 4px; padding: 4px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>

<header>
  <h1>테스트 케이스 정의서</h1>
  <p>Coupa × Teams 연동 챗봇 &nbsp;·&nbsp; v3 &nbsp;·&nbsp; 총 32개 TC</p>
</header>

<div class="stats">
  <div class="stat"><span class="badge pass" id="stat-pass">PASS 0</span></div>
  <div class="stat"><span class="badge partial" id="stat-partial">PARTIAL 0</span></div>
  <div class="stat"><span class="badge pending" id="stat-pending">PENDING 0</span></div>
  <div class="stat" style="color:var(--muted);font-size:12px;" id="stat-pct"></div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="process">프로세스 안내 (TC-01~13)</div>
  <div class="tab" data-tab="coupa">Coupa API (TC-14~21)</div>
  <div class="tab" data-tab="notify">알림 (TC-22~28)</div>
  <div class="tab" data-tab="approval">단계별 승인 (TC-29~32)</div>
</div>

<div class="content">

<!-- ===== TAB: 프로세스 안내 ===== -->
<div class="tab-panel active" id="tab-process">
  <div class="section-label">프로세스 안내 — 챗봇 질의응답</div>
</div>

<!-- ===== TAB: Coupa API ===== -->
<div class="tab-panel" id="tab-coupa">
  <div class="section-label">Coupa 계약 조회 / PO 조회 / URL 분석</div>
</div>

<!-- ===== TAB: 알림 ===== -->
<div class="tab-panel" id="tab-notify">
  <div class="section-label">D-60 만료 알림 / 계약 상태변경 알림</div>
</div>

<!-- ===== TAB: 단계별 승인 ===== -->
<div class="tab-panel" id="tab-approval">
  <div class="section-label">단계별 승인 알림 (Coupa Approval Webhook)</div>
</div>

</div><!-- /content -->

<script>
// ── TC 데이터 ──────────────────────────────────────────────────────────────
const TCS = [
  // 프로세스 안내
  { id:'TC-01', tab:'process', priority:'critical',
    input:'구매 계약 진행하려는데 어떻게 해?',
    expected:'Coupa Catalog 접속 → 구매 요청서 작성 절차 안내' },
  { id:'TC-02', tab:'process', priority:'critical',
    input:'On-Budget 500만원 구매 결재 라인 알려줘',
    expected:'팀장 → 본부장',
    uat:'pass', uatNote:'팀장→본부장' },
  { id:'TC-03', tab:'process', priority:'critical',
    input:'On-Budget 2000만원 구매 결재 라인 알려줘',
    expected:'팀장 → 본부장 → 구매거래위원회',
    uat:'pass', uatNote:'팀장→본부장→구매거래위원회' },
  { id:'TC-04', tab:'process', priority:'critical',
    input:'Off-Budget 100만원 결재 라인 알려줘',
    expected:'팀장 → 본부장' },
  { id:'TC-05', tab:'process', priority:'critical',
    input:'Off-Budget 500만원 결재 라인 알려줘',
    expected:'팀장 → 본부장 → CFO',
    uat:'pass', uatNote:'팀장→본부장→CFO' },
  { id:'TC-06', tab:'process', priority:'critical',
    input:'Off-Budget 5000만원 결재 라인 알려줘',
    expected:'팀장 → 본부장 → CFO → CEO' },
  { id:'TC-07', tab:'process', priority:'critical',
    input:'Off-Budget 2억짜리 구매는 누구한테 결재 받아?',
    expected:'팀장 → 본부장 → CFO → CEO → Global CFO' },
  { id:'TC-08', tab:'process', priority:'critical',
    input:'유지보수 계약 시 어떤 견적서 첨부해야 해?',
    expected:'유지보수 견적서 첨부 안내' },
  { id:'TC-09', tab:'process', priority:'critical',
    input:'신규 장비 구매 시 어떤 견적서 첨부해야 해?',
    expected:'단가 견적서 첨부 안내' },
  { id:'TC-10', tab:'process', priority:'critical',
    input:'Coupa 작성 후 다음 단계가 뭐야?',
    expected:'법무팀 계약서 작성 → 인감사용 신청 → 날인 → 완료' },
  { id:'TC-11', tab:'process', priority:'critical',
    input:'인감사용 신청은 어디서 해?',
    expected:'전자결재시스템에서 인감사용 신청서 작성 안내' },
  { id:'TC-12', tab:'process', priority:'critical',
    input:'경비 처리는 어떻게 해?',
    expected:'Concur에서 경비 보고서 작성 안내',
    uat:'pass', uatNote:'Concur 경비보고서' },
  { id:'TC-13', tab:'process', priority:'critical',
    input:'계약 연장도 신규 구매랑 같은 프로세스야?',
    expected:'동일한 결재 라인 및 첨부 서류 필요 안내' },

  // Coupa 계약 조회
  { id:'TC-14', tab:'coupa', priority:'important',
    input:'123번 계약 만료일이 언제야?',
    expected:'계약명, 상태, 만료일, 담당자, 공급업체 정보 반환' },
  { id:'TC-15', tab:'coupa', priority:'important',
    input:'ABC Corp 계약 찾아줘',
    expected:'유사 계약 목록 + Coupa 참고 안내' },
  { id:'TC-16', tab:'coupa', priority:'important',
    input:'존재하지 않는 999999번 계약 알려줘',
    expected:'계약 정보를 찾을 수 없다는 안내',
    uat:'pass', uatNote:'담당부서 확인 안내' },

  // PO 조회
  { id:'TC-17', tab:'coupa', priority:'important',
    input:'123번 계약 PO 발행됐어?',
    expected:'PO 번호, 상태(issued/draft 등), 발주일, 금액 반환' },
  { id:'TC-18', tab:'coupa', priority:'important',
    input:'123번 계약 발주서 나왔어?',
    expected:'TC-17과 동일 (발주 키워드 감지)' },
  { id:'TC-19', tab:'coupa', priority:'important',
    input:'PO 발행됐어? (계약 번호 없이)',
    expected:'계약 번호를 함께 알려달라는 안내',
    uat:'partial', uatNote:'PO 확인 방법 안내' },

  // URL 분석
  { id:'TC-20', tab:'coupa', priority:'optional',
    input:'https://company.coupahost.com/contracts/123 URL 전송',
    expected:'만료일 임박 여부, 결재 라인 적정성, 주의사항, 다음 액션 추천' },
  { id:'TC-21', tab:'coupa', priority:'optional',
    input:'https://company.coupahost.com/contracts/123/edit URL 전송',
    expected:'TC-20과 동일' },

  // D-60 알림
  { id:'TC-22', tab:'notify', priority:'critical',
    input:'만료일이 오늘 기준 60일 이내인 active 계약 존재',
    expected:'매일 오전 9시 담당자 Teams 채널로 Adaptive Card 알림 발송' },
  { id:'TC-23', tab:'notify', priority:'critical',
    input:'만료일이 61일 이상 남은 계약',
    expected:'알림 미발송' },
  { id:'TC-24', tab:'notify', priority:'critical',
    input:'DynamoDB에 담당자 이메일 매핑 없음',
    expected:'default webhook URL로 fallback 발송' },

  // 상태변경 알림
  { id:'TC-25', tab:'notify', priority:'critical',
    input:'Coupa에서 계약 approved',
    expected:'담당자 채널로 "✅ 계약 최종 승인" 알림' },
  { id:'TC-26', tab:'notify', priority:'critical',
    input:'Coupa에서 계약 rejected',
    expected:'담당자 채널로 "❌ 계약 거절" 알림' },
  { id:'TC-27', tab:'notify', priority:'critical',
    input:'Coupa에서 계약 cancelled',
    expected:'담당자 채널로 "🚫 계약 반려" 알림' },
  { id:'TC-28', tab:'notify', priority:'critical',
    input:'Coupa에서 계약 draft 상태',
    expected:'알림 미발송 (NOTIFY_STATUSES 제외)' },

  // 단계별 승인
  { id:'TC-29', tab:'approval', priority:'critical',
    input:'1차 승인자(팀장) 승인 완료',
    expected:'"✅ 1차 승인 완료" Teams 알림' },
  { id:'TC-30', tab:'approval', priority:'critical',
    input:'2차 승인자(본부장) 승인 완료',
    expected:'"✅ 2차 승인 완료" Teams 알림' },
  { id:'TC-31', tab:'approval', priority:'critical',
    input:'승인자가 반려',
    expected:'"❌ 반려 — N차 승인" Teams 알림' },
  { id:'TC-32', tab:'approval', priority:'critical',
    input:'pending_approval 상태',
    expected:'알림 미발송 (NOTIFY_APPROVAL_STATUSES 제외)' },
];

// ── UAT 상태 (localStorage 지속) ──────────────────────────────────────────
const STORAGE_KEY = 'uat_results_v1';
let uatData = {};

function loadUAT() {
  try { uatData = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { uatData = {}; }
  // 초기값 주입
  TCS.forEach(tc => {
    if (tc.uat && !uatData[tc.id]) uatData[tc.id] = { status: tc.uat, note: tc.uatNote || '' };
    else if (!uatData[tc.id]) uatData[tc.id] = { status: 'pending', note: '' };
  });
}
function saveUAT() { localStorage.setItem(STORAGE_KEY, JSON.stringify(uatData)); }

// ── 렌더링 ────────────────────────────────────────────────────────────────
const PRIORITY_MAP = { critical:'🔴 필수', important:'🟡 중요', optional:'🟢 선택' };
const PRIORITY_CLASS = { critical:'p-critical', important:'p-important', optional:'p-optional' };

function uatBadgeHTML(status) {
  if (status === 'pass') return '<span class="uat-badge uat-pass">✅ PASS</span>';
  if (status === 'partial') return '<span class="uat-badge uat-partial">⚠️ PARTIAL</span>';
  if (status === 'fail') return '<span class="uat-badge" style="background:#3d1a1a;color:#f85149">❌ FAIL</span>';
  return '<span class="uat-badge uat-pending">— PENDING</span>';
}

function renderCards(tab) {
  const panel = document.getElementById('tab-' + tab);
  const label = panel.querySelector('.section-label').outerHTML;
  const cards = TCS.filter(tc => tc.tab === tab).map(tc => {
    const uat = uatData[tc.id] || { status:'pending', note:'' };
    return `
    <div class="tc-card" id="card-${tc.id}">
      <div class="tc-header" onclick="toggleCard('${tc.id}')">
        <span class="tc-id">${tc.id}</span>
        <span class="tc-input">${tc.input}</span>
        ${uatBadgeHTML(uat.status)}
        <span class="chevron">▶</span>
      </div>
      <div class="tc-detail">
        <div class="detail-grid">
          <span class="detail-label">입력 질문</span>
          <span class="detail-value">${tc.input}</span>
          <span class="detail-label">기대 답변</span>
          <span class="detail-value expected">${tc.expected}</span>
          <span class="detail-label">우선순위</span>
          <span class="detail-value"><span class="priority-tag ${PRIORITY_CLASS[tc.priority]}">${PRIORITY_MAP[tc.priority]}</span></span>
          <span class="detail-label">UAT 결과</span>
          <span class="detail-value uat-result ${uat.status}" id="uat-result-${tc.id}">
            ${uatBadgeHTML(uat.status)} ${uat.note ? '— ' + uat.note : ''}
          </span>
        </div>
        <div class="uat-edit">
          <label>결과 업데이트:</label>
          <select id="sel-${tc.id}" onchange="updateUAT('${tc.id}')">
            <option value="pending" ${uat.status==='pending'?'selected':''}>— PENDING</option>
            <option value="pass" ${uat.status==='pass'?'selected':''}>✅ PASS</option>
            <option value="partial" ${uat.status==='partial'?'selected':''}>⚠️ PARTIAL</option>
            <option value="fail" ${uat.status==='fail'?'selected':''}>❌ FAIL</option>
          </select>
          <input id="note-${tc.id}" type="text" placeholder="메모 (선택)" value="${uat.note || ''}">
          <button onclick="saveCard('${tc.id}')">저장</button>
        </div>
      </div>
    </div>`;
  }).join('');
  panel.innerHTML = label + cards;
}

function toggleCard(id) {
  const card = document.getElementById('card-' + id);
  card.classList.toggle('open');
}

function updateUAT(id) { /* live preview optional */ }

function saveCard(id) {
  const status = document.getElementById('sel-' + id).value;
  const note = document.getElementById('note-' + id).value;
  uatData[id] = { status, note };
  saveUAT();
  // re-render badge in header
  const card = document.getElementById('card-' + id);
  card.querySelector('.uat-badge') && (card.querySelector('.tc-header').innerHTML = card.querySelector('.tc-header').innerHTML);
  // full re-render of the tab
  const tc = TCS.find(t => t.id === id);
  renderCards(tc.tab);
  updateStats();
  // reopen
  setTimeout(() => {
    const c = document.getElementById('card-' + id);
    if (c) c.classList.add('open');
  }, 10);
}

function updateStats() {
  const all = Object.values(uatData);
  const pass = all.filter(v => v.status === 'pass').length;
  const partial = all.filter(v => v.status === 'partial').length;
  const pending = all.filter(v => v.status === 'pending').length;
  const total = TCS.length;
  document.getElementById('stat-pass').textContent = `PASS ${pass}`;
  document.getElementById('stat-partial').textContent = `PARTIAL ${partial}`;
  document.getElementById('stat-pending').textContent = `PENDING ${pending}`;
  const done = pass + partial + all.filter(v => v.status === 'fail').length;
  document.getElementById('stat-pct').textContent = `진행률 ${done}/${total} (${Math.round(done/total*100)}%)`;
}

// ── 탭 전환 ───────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
  });
});

// ── 초기화 ────────────────────────────────────────────────────────────────
loadUAT();
['process','coupa','notify','approval'].forEach(renderCards);
updateStats();
</script>
</body>
</html>
