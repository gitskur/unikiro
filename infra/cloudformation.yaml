AWSTemplateFormatVersion: '2010-09-09'
Description: Coupa AI Facilitator - S3 + IAM + Lambda + API Gateway

Parameters:
  LayerArn:
    Type: String
    Description: Lambda Layer ARN (build_layer.bat 실행 후 출력된 ARN)
  BotPassword:
    Type: String
    NoEcho: true
    Description: Azure Bot 앱 비밀번호 (Azure Portal에서 발급)

Resources:

  # ── S3: 매뉴얼 문서 버킷 ──────────────────────────────────────────────
  DocsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub coupa-ai-docs-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ── IAM: Lambda 실행 역할 ─────────────────────────────────────────────
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: coupa-ai-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CoupaAiPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DocsBucket.Arn
                  - !Sub ${DocsBucket.Arn}/*
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-3-sonnet-20240229-v1:0

  # ── Lambda 함수 ───────────────────────────────────────────────────────
  LambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: coupa-ai-facilitator
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 60
      MemorySize: 512
      Layers:
        - !Ref LayerArn
      Environment:
        Variables:
          DOCS_BUCKET: !Ref DocsBucket
          DOCS_PREFIX: manuals/
          BOT_PASSWORD: !Ref BotPassword
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200, "body": "deploy lambda_function.py"}

  # ── API Gateway ───────────────────────────────────────────────────────
  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: coupa-ai-api
      Description: Coupa AI Facilitator API

  ChatResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: chat

  # POST /chat
  PostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ChatResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunction.Arn}/invocations

  # OPTIONS /chat (CORS preflight)
  OptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ChatResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # Lambda 호출 권한
  LambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/POST/chat

  # ── /teams 리소스 (Teams Bot Framework 웹훅) ──────────────────────────
  TeamsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: teams

  TeamsPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref TeamsResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunction.Arn}/invocations

  TeamsLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/POST/teams

  # 배포
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [PostMethod, OptionsMethod, TeamsPostMethod]
    Properties:
      RestApiId: !Ref RestApi
      StageName: prod

Outputs:
  ApiUrl:
    Description: "Chat UI에 입력할 API URL"
    Value: !Sub https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/chat

  TeamsWebhookUrl:
    Description: "Azure Bot에 등록할 Teams 웹훅 URL"
    Value: !Sub https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/teams

  DocsBucketName:
    Description: "PDF/PPT 매뉴얼을 업로드할 S3 버킷"
    Value: !Ref DocsBucket
